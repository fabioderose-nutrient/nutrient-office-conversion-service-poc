spring.application.name=office-conversion-service
server.port=${PORT:8080}

# Nutrient Java SDK. Empty key = evaluation mode (watermarked output).
nutrient.license-key=${NUTRIENT_LICENSE_KEY:}
nutrient.sdk-version=@nutrient.version@

# Uploads
spring.servlet.multipart.max-file-size=${MAX_FILE_SIZE:50MB}
spring.servlet.multipart.max-request-size=${MAX_REQUEST_SIZE:200MB}
conversion.max-files=${MAX_FILES:20}

# How many documents the native engine converts at the same time
conversion.concurrency=${CONVERSION_CONCURRENCY:4}

# Temporary job folders, deleted after the retention time
jobs.dir=${JOBS_DIR:}
jobs.retention-minutes=${JOBS_RETENTION_MINUTES:60}

# Keep error responses free of stack traces
server.error.include-stacktrace=never
server.error.include-message=never
